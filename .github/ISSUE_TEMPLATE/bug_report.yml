name: Bug report
description: Report a problem with a wallpaper or the app
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Include only the details needed to reproduce the problem. Remove personal files, account information, and private paths from screenshots or logs. You can write in any supported language."
  - type: input
    id: version
    attributes:
      label: Hokucat and macOS versions
      placeholder: "Hokucat version and macOS version"
    validations:
      required: true
  - type: input
    id: wallpaper
    attributes:
      label: Wallpaper
      description: Title and original page if this happens with a particular wallpaper
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do and what happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots and display details
      description: For display problems include display count, resolutions, and whether it followed sleep or reconnection. Do not attach third-party wallpaper packages.
